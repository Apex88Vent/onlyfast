name: OnlyFast 2027 validation
on:
  push:
    branches: [develop/onlyfast-2027]
  pull_request:
    branches: [main, develop/onlyfast-2027]
permissions:
  contents: read
concurrency:
  group: onlyfast-2027-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          # Match the runtime used for the complete local verification. The
          # interrupted runs used 24.22.2 and stopped inside the sandbox test.
          node-version: '24.18.0'
          cache: npm
      - run: npm ci
      - name: Native sandbox preparation and safety tests
        run: node --experimental-strip-types --test tests/nativeSandbox.test.ts
      - name: Remaining application and disposable database permission tests
        shell: bash
        run: |
          test_files=()
          for test_file in tests/*.test.ts; do
            if [[ "$test_file" != "tests/nativeSandbox.test.ts" ]]; then
              test_files+=("$test_file")
            fi
          done
          node --experimental-strip-types --test --test-concurrency=2 "${test_files[@]}"
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npx tsc --noEmit -p tsconfig.node.json
      - run: npm run build -- --mode onlyfast-2027
      # No deployments, secrets, database connections or billing credentials.
