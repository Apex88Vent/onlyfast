<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OnlyFast Rookie Ad Slot Preview</title>
    <style>
      :root {
        --blue: #00a8e8;
        --blue-dark: #0090c7;
        --ink: #1a1b23;
        --muted: #4b5563;
        --soft: #f5f5f7;
        --line: #d7eef8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--soft);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(1040px, calc(100% - 32px));
        margin: 0 auto;
        padding: 32px 0;
      }

      .logo {
        display: block;
        height: 56px;
        width: auto;
        object-fit: contain;
      }

      h1 {
        margin: 18px 0 4px;
        font-size: 28px;
        line-height: 1.15;
      }

      .intro {
        margin: 0 0 28px;
        color: #6b7280;
        font-size: 14px;
      }

      .preview-stack {
        display: grid;
        gap: 24px;
      }

      .preview-title {
        margin: 0 0 8px;
        color: #374151;
        font-size: 14px;
        font-weight: 800;
      }

      .slot {
        position: relative;
        overflow: hidden;
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: white;
        box-shadow: 0 14px 32px rgb(0 168 232 / 10%);
      }

      .slot::before {
        content: "";
        position: absolute;
        inset: 0 0 auto;
        height: 4px;
        background: var(--blue);
      }

      .slot-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding: 22px;
      }

      .copy-row {
        display: flex;
        min-width: 0;
        gap: 16px;
        align-items: flex-start;
      }

      .icon {
        display: grid;
        flex: 0 0 auto;
        width: 56px;
        height: 56px;
        place-items: center;
        border-radius: 12px;
        background: #eaf8fe;
        color: var(--blue);
        font-size: 28px;
        font-weight: 900;
      }

      .slot-logo {
        display: block;
        height: 32px;
        width: auto;
        margin-bottom: 8px;
        object-fit: contain;
      }

      .eyebrow {
        margin: 0;
        color: var(--blue);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: .04em;
        text-transform: uppercase;
      }

      h2 {
        margin: 4px 0 0;
        font-size: 19px;
        line-height: 1.25;
      }

      .body {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.45;
      }

      .benefits {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 12px 0 0;
        padding: 0;
        list-style: none;
      }

      .benefits li {
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #f3fbfe;
        padding: 5px 12px;
        font-size: 12px;
        font-weight: 700;
      }

      .actions {
        display: flex;
        flex: 0 0 auto;
        min-width: 192px;
        flex-direction: column;
        gap: 8px;
      }

      button {
        min-height: 44px;
        border-radius: 12px;
        border: 1px solid #e5e7eb;
        padding: 10px 18px;
        font: inherit;
        font-size: 14px;
        font-weight: 800;
      }

      .primary {
        border-color: var(--blue);
        background: var(--blue);
        color: white;
      }

      .secondary {
        background: white;
        color: var(--muted);
      }

      .interstitial-wrap {
        border-radius: 24px;
        background: var(--ink);
        padding: 16px;
        box-shadow: 0 24px 48px rgb(26 27 35 / 22%);
      }

      .interstitial {
        max-width: 560px;
        margin: 0 auto;
        text-align: center;
      }

      .interstitial .slot-inner,
      .interstitial .copy-row {
        flex-direction: column;
        align-items: center;
      }

      .interstitial .slot-logo {
        height: 40px;
        margin: 0 auto 8px;
      }

      .interstitial .actions {
        width: 100%;
        max-width: 430px;
        flex-direction: row;
        justify-content: center;
      }

      .note {
        margin: 12px 0 0;
        color: #6b7280;
        font-size: 12px;
      }

      @media (max-width: 720px) {
        .slot-inner {
          align-items: stretch;
          flex-direction: column;
        }

        .actions,
        .interstitial .actions {
          width: 100%;
          max-width: none;
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="onlyfast-logo.png" alt="OnlyFast" class="logo" />
      <h1>Rookie Ad Slot Preview</h1>
      <p class="intro">Static local preview. No localhost server required.</p>

      <div class="preview-stack" id="preview"></div>
    </main>

    <script>
      const placements = [
        ['Setup Dashboard Bottom', 'Placeholder ad slot', 'Rookie plan is ad-supported.', 'Upgrade to Pro for $5/mo to remove ads and keep your setup notebook cleaner.', ['Ad-free screens.', 'Export setups.', 'More setup tools.']],
        ['Setup Session Bottom', 'Placeholder ad slot', 'Keep tuning. Lose the ads.', 'Upgrade to Pro for $5/mo for an ad-free setup notebook.', ['Cleaner setup screens.', 'More saved workflow.', 'Export-ready setups.']],
        ['Parts Reference Bottom', 'Placeholder ad slot', 'Build your edge with Pro.', 'Upgrade to Pro for $5/mo to remove ads and unlock a cleaner parts workflow.', ['Ad-free parts reference.', 'More tools.', 'Faster workflow.']],
        ['Schedule Bottom', 'Placeholder ad slot', 'Plan race days with fewer distractions.', 'Upgrade to Pro for $5/mo and remove Rookie ads.', ['Cleaner screens.', 'Less clutter.', 'Faster workflow.']],
        ['Timing Scan Bottom', 'Placeholder ad slot', 'Scan results. Skip the ads.', 'Upgrade to Pro for $5/mo for a cleaner timing workflow.', ['Ad-free timing.', 'More tools.', 'Cleaner workflow.']],
        ['After Save Interstitial', 'Setup Saved', 'Rookie plan is ad-supported.', 'Upgrade to Pro for $5/mo to remove ads and keep working faster.', ['Ad-free experience.', 'Export setups.', 'More setup tools.'], 'Temporary house ad until Media.net, AdMob, or another ad provider is approved.'],
      ];

      function slot([name, eyebrow, title, body, benefits, note]) {
        const isInterstitial = name === 'After Save Interstitial';
        return `
          <section>
            <h2 class="preview-title">${name}</h2>
            <div class="${isInterstitial ? 'interstitial-wrap' : ''}">
              <article class="slot ${isInterstitial ? 'interstitial' : ''}">
                <div class="slot-inner">
                  <div class="copy-row">
                    <div class="icon">${isInterstitial ? '*' : '>'}</div>
                    <div>
                      <img src="onlyfast-logo.png" alt="OnlyFast" class="slot-logo" />
                      <p class="eyebrow">${eyebrow}</p>
                      <h2>${title}</h2>
                      <p class="body">${body}</p>
                      <ul class="benefits">${benefits.map((benefit) => `<li>${benefit}</li>`).join('')}</ul>
                      ${note ? `<p class="note">${note}</p>` : ''}
                    </div>
                  </div>
                  <div class="actions">
                    <button class="primary" type="button">Upgrade to Pro</button>
                    <button class="secondary" type="button">Continue with Rookie</button>
                  </div>
                </div>
              </article>
            </div>
          </section>
        `;
      }

      document.getElementById('preview').innerHTML = placements.map(slot).join('');
    </script>
  </body>
</html>
